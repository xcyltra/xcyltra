<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="220" viewBox="0 0 1200 220" role="img" aria-labelledby="title desc">
  <title id="title">Hee Hii Hooo, Laudya's here. Looking for something?</title>
  <desc id="desc">An autumn-themed animated banner with falling leaves.</desc>
  <defs>
    <linearGradient id="background" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b1f2b"/>
      <stop offset="52%" stop-color="#7b3f32"/>
      <stop offset="100%" stop-color="#d47a35"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#ffd58a" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#ffd58a" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1b0e16" flood-opacity=".55"/>
    </filter>
    <clipPath id="typing-clip" clipPathUnits="userSpaceOnUse">
      <rect x="85" y="75" width="0" height="100">
        <animate attributeName="width" from="0" to="1030" dur="3.8s" begin="0s" fill="freeze"/>
      </rect>
    </clipPath>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Butterfly+Kids&amp;display=swap");

      .banner-text {
        fill: #fff7e6;
        font-family: "Times New Roman", Times, serif;
        font-size: 38px;
        font-weight: 400;
        letter-spacing: .5px;
        text-anchor: middle;
      }
      .leaf {
        transform-box: fill-box;
        transform-origin: center;
        animation: fall var(--duration) var(--delay) linear infinite;
      }
      @keyframes fall {
        0% {
          opacity: 0;
          transform: translate3d(0, -45px, 0) rotate(0deg);
        }
        12% { opacity: .95; }
        100% {
          opacity: .15;
          transform: translate3d(var(--drift), 300px, 0) rotate(var(--rotation));
        }
      }
      .typing-cursor {
        animation: cursor 3.8s steps(1, end) forwards;
      }
      @keyframes cursor {
        0%, 96% { opacity: 1; }
        98%, 100% { opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .leaf, .typing-cursor { animation-play-state: paused; }
      }
    </style>
  </defs>

  <rect width="1200" height="220" rx="18" fill="url(#background)"/>
  <rect width="1200" height="220" rx="18" fill="url(#glow)"/>

  <g transform="translate(48 -18) rotate(-25)">
    <g class="leaf" style="--duration: 6.4s; --delay: -.8s; --drift: 95px; --rotation: 420deg">
      <path d="M0 0C-18 4-25 18-14 28C-4 36 7 28 8 15C12 28 22 32 29 22C36 10 20 2 0 0Z" fill="#e76f32"/>
      <path d="M1 3L8 27" stroke="#7b3f32" stroke-width="2" fill="none"/>
    </g>
  </g>
  <g transform="translate(217 -35) rotate(35)">
    <g class="leaf" style="--duration: 8.7s; --delay: -4.1s; --drift: -130px; --rotation: 540deg">
      <path d="M0 0C-18 4-25 18-14 28C-4 36 7 28 8 15C12 28 22 32 29 22C36 10 20 2 0 0Z" fill="#f2a33a"/>
      <path d="M1 3L8 27" stroke="#8f4b29" stroke-width="2" fill="none"/>
    </g>
  </g>
  <g transform="translate(402 -12) rotate(-10)">
    <g class="leaf" style="--duration: 5.8s; --delay: -1.7s; --drift: 150px; --rotation: 300deg">
      <path d="M0 0C-18 4-25 18-14 28C-4 36 7 28 8 15C12 28 22 32 29 22C36 10 20 2 0 0Z" fill="#b84a2b"/>
      <path d="M1 3L8 27" stroke="#6b2d2b" stroke-width="2" fill="none"/>
    </g>
  </g>
  <g transform="translate(625 -28) rotate(20)">
    <g class="leaf" style="--duration: 7.3s; --delay: -5.3s; --drift: -90px; --rotation: 480deg">
      <path d="M0 0C-18 4-25 18-14 28C-4 36 7 28 8 15C12 28 22 32 29 22C36 10 20 2 0 0Z" fill="#df6c35"/>
      <path d="M1 3L8 27" stroke="#7b3f32" stroke-width="2" fill="none"/>
    </g>
  </g>
  <g transform="translate(842 -20) rotate(-40)">
    <g class="leaf" style="--duration: 9.2s; --delay: -2.6s; --drift: 175px; --rotation: 600deg">
      <path d="M0 0C-18 4-25 18-14 28C-4 36 7 28 8 15C12 28 22 32 29 22C36 10 20 2 0 0Z" fill="#f2a33a"/>
      <path d="M1 3L8 27" stroke="#8f4b29" stroke-width="2" fill="none"/>
    </g>
  </g>
  <g transform="translate(1090 -32) rotate(15)">
    <g class="leaf" style="--duration: 6.8s; --delay: -3.4s; --drift: -155px; --rotation: 360deg">
      <path d="M0 0C-18 4-25 18-14 28C-4 36 7 28 8 15C12 28 22 32 29 22C36 10 20 2 0 0Z" fill="#b84a2b"/>
      <path d="M1 3L8 27" stroke="#6b2d2b" stroke-width="2" fill="none"/>
    </g>
  </g>

  <g filter="url(#shadow)" clip-path="url(#typing-clip)">
    <text class="banner-text" x="600" y="105">Hee Hii Hooo, Laudya's here.</text>
    <text class="banner-text" x="600" y="145" font-size="28">Looking for something?</text>
  </g>
  <rect class="typing-cursor" x="825" y="78" width="3" height="78" rx="1.5" fill="#fff7e6"/>
</svg>
