<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="220" viewBox="0 0 1200 220" role="img" aria-labelledby="title desc">
  <title id="title">Hee Hii Hooo, Laudya's here. Looking for something?</title>
  <desc id="desc">An autumn-themed animated banner with falling leaves.</desc>
  <defs>
    <linearGradient id="background" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b1f2b"/>
      <stop offset="52%" stop-color="#7b3f32"/>
      <stop offset="100%" stop-color="#d47a35"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#ffd58a" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#ffd58a" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1b0e16" flood-opacity=".55"/>
    </filter>
    <style>
      .banner-text {
        fill: #fff7e6;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 30px;
        font-weight: 700;
        letter-spacing: .5px;
        text-anchor: middle;
      }
      .leaf {
        transform-box: fill-box;
        transform-origin: center;
        animation: fall linear infinite;
      }
      @keyframes fall {
        0% {
          opacity: 0;
          transform: translate3d(0, -35px, 0) rotate(0deg);
        }
        12% { opacity: .95; }
        100% {
          opacity: .15;
          transform: translate3d(120px, 285px, 0) rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .leaf { animation-play-state: paused; }
      }
    </style>
  </defs>

  <rect width="1200" height="220" rx="18" fill="url(#background)"/>
  <rect width="1200" height="220" rx="18" fill="url(#glow)"/>

  <g class="leaf" style="animation-duration: 6s; animation-delay: 0s" transform="translate(90 -20) rotate(-25)">
    <path d="M0 0C-18 4-25 18-14 28C-4 36 7 28 8 15C12 28 22 32 29 22C36 10 20 2 0 0Z" fill="#e76f32"/>
    <path d="M1 3L8 27" stroke="#7b3f32" stroke-width="2" fill="none"/>
  </g>
  <g class="leaf" style="animation-duration: 8s; animation-delay: 1.8s" transform="translate(280 -25) rotate(35)">
    <path d="M0 0C-18 4-25 18-14 28C-4 36 7 28 8 15C12 28 22 32 29 22C36 10 20 2 0 0Z" fill="#f2a33a"/>
    <path d="M1 3L8 27" stroke="#8f4b29" stroke-width="2" fill="none"/>
  </g>
  <g class="leaf" style="animation-duration: 5.5s; animation-delay: .6s" transform="translate(490 -18) rotate(-10)">
    <path d="M0 0C-18 4-25 18-14 28C-4 36 7 28 8 15C12 28 22 32 29 22C36 10 20 2 0 0Z" fill="#b84a2b"/>
    <path d="M1 3L8 27" stroke="#6b2d2b" stroke-width="2" fill="none"/>
  </g>
  <g class="leaf" style="animation-duration: 7s; animation-delay: 2.7s" transform="translate(700 -30) rotate(20)">
    <path d="M0 0C-18 4-25 18-14 28C-4 36 7 28 8 15C12 28 22 32 29 22C36 10 20 2 0 0Z" fill="#df6c35"/>
    <path d="M1 3L8 27" stroke="#7b3f32" stroke-width="2" fill="none"/>
  </g>
  <g class="leaf" style="animation-duration: 9s; animation-delay: 1s" transform="translate(920 -22) rotate(-40)">
    <path d="M0 0C-18 4-25 18-14 28C-4 36 7 28 8 15C12 28 22 32 29 22C36 10 20 2 0 0Z" fill="#f2a33a"/>
    <path d="M1 3L8 27" stroke="#8f4b29" stroke-width="2" fill="none"/>
  </g>
  <g class="leaf" style="animation-duration: 6.5s; animation-delay: 3.2s" transform="translate(1110 -24) rotate(15)">
    <path d="M0 0C-18 4-25 18-14 28C-4 36 7 28 8 15C12 28 22 32 29 22C36 10 20 2 0 0Z" fill="#b84a2b"/>
    <path d="M1 3L8 27" stroke="#6b2d2b" stroke-width="2" fill="none"/>
  </g>

  <g filter="url(#shadow)">
    <text class="banner-text" x="600" y="115">Hee Hii Hooo, Laudya's here.</text>
    <text class="banner-text" x="600" y="155" font-size="21">Looking for something?</text>
  </g>
</svg>
